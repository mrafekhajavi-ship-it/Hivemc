<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Proximity Voice Chat</title>
  
  <!-- کتابخانه برای استایل سریع ترمینال -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- کتابخانه سوکت برای اتصال به سرور رندر -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    body {
      background-color: #0f1117;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: #1a1d24;
      border: 1px solid #2d3748;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      margin-bottom: 20px;
    }

    .input-box {
      width: 90%;
      padding: 12px 16px;
      background: #0f1117;
      border: 1px solid #4a5568;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      outline: none;
      text-align: center;
      margin-top: 15px;
      transition: border-color 0.2s;
    }

    .input-box:focus {
      border-color: #a855f7;
    }

    /* استایل دکمه نئونی چرخشی انتخابی شما */
        /* دکمه سایبرپانکی و کادر نوری Uiverse */
    .button {
      position: relative;
      cursor: pointer;
      border: none;
      width: 140px;
      height: 44px;
      background: #111;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 25px;
      font-size: 14px;
      font-weight: bold;
    }

    .text {
      position: relative;
      z-index: 1;
    }

    .button::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      background: radial-gradient(circle at 50% 50%, #0000 0, #0000 20%, #111111aa 50%),
                  radial-gradient(ellipse 100% 100%, #fff, #fff0);
      background-size: 3px 3px, auto auto;
      transition: 0.3s;
    }

    .button:hover::before {
      opacity: 0.3;
    }

    .a {
      pointer-events: none;
      position: absolute;
      --w: 2px;
      --t: -40px;
      --s: calc(var(--t) * -1);
      --e: calc(100% + var(--t));
      --g: #fff0, #fff3 var(--s), #fffa var(--s), #fff, #fffa var(--e), #fff3 var(--e), #fff0;
    }

    .a::before {
      content: "";
      position: absolute;
      inset: 0;
      background: inherit;
      filter: blur(4px);
      z-index: -2;
    }

    .a::after {
      content: "";
      position: absolute;
      inset: 0;
      background: inherit;
      filter: blur(10px);
      opacity: 0;
      z-index: -2;
      transition: 0.3s;
    }

    .button:hover .a::after {
      opacity: 1;
    }

    .l { left: -2px; }
    .r { right: -2px; }
    .l, .r {
      background: linear-gradient(var(--g));
      top: var(--t);
      bottom: var(--t);
      width: var(--w);
    }

    .t { top: -2px; }
    .b { bottom: -2px; }
    .t, .b {
      background: linear-gradient(90deg, var(--g));
      left: var(--t);
      right: var(--t);
      height: var(--w);
    }
/* From Uiverse.io by nazar-gavrylyk */ 
.container {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  align-items: center;
}

.label {
  position: relative;
  display: flex;
  width: 250px;
  border-radius: 6px;
  border: 2px solid #373737;
  padding: 15px 8px 15px 10px;
  text-align: left;
  transition: all 0.3s ease; /* برای نرم شدن افکت */
}

/* تغییر رنگ کادر به سفید موقع کلیک داخل فرم */
.label:focus-within {
  border-color: #ffffff;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.4); /* افکت نور سفید ملایم */
}

.label .icon {
  position: absolute;
  top: 53%;
  right: 0;
  transform: translate(-50%, -50%);
  transition: all 0.3s ease;
  color: #c5c5c5;
}

/* سفید شدن آیکون هنگام کلیک */
.label:focus-within .icon {
  color: #ffffff;
}

.label .input {
  background-color: transparent;
  outline: none;
  border: none;
  color: #c5c5c5;
  font-size: 16px;
  width: 100%;
}

/* روشن‌تر شدن رنگ متن موقع نوشتن */
.label .input:focus {
  color: #ffffff;
}

    
  </style>
</head>
<body>

  <!-- کارت اصلی ورود -->
  <div class="card" id="loginSection">
    <h1 style="font-size: 22px; margin-bottom: 6px; font-weight: bold;">ویس‌چت ماینکرفت</h1>
    <p style="font-size: 13px; color: #a0aec0;">نام کاربری خود داخل سرور را وارد کنید</p>
    
    <input type="text" id="usernameInput" class="input-box" placeholder="مثلاً: Steve" autocomplete="off" />
    <br>
        <button id="joinBtn" class="button">
      <span class="text">ورود به ویس‌چت</span>
      <span class="a t"></span>
      <span class="a r"></span>
      <span class="a b"></span>
      <span class="a l"></span>
    </button>

  </div>

  <!-- کارت وضعیت بعد از ورود -->
  <div class="card" id="voiceSection" style="display: none;">
    <h2 id="userGreeting" style="font-size: 18px; font-weight: bold; color: #4ade80;">متصل شدید</h2>
    <div id="statusDiv" class="badge">در انتظار دریافت مختصات از بازی...</div>

    <div style="margin-top: 20px; text-align: right;">
      <h3 style="font-size: 14px; color: #cbd5e1; margin-bottom: 8px;">افراد متصل:</h3>
      <ul id="peersList" style="list-style: none; padding: 0; margin: 0; font-size: 13px; color: #94a3b8;">
        <li>هیچ بازیکنی متصل نیست</li>
      </ul>
    </div>
  </div>

  <!-- ترمینال لاگ‌ها (انتخابی شما) -->
  <aside class="bg-black text-white p-5 rounded-xl w-full max-w-lg font-mono shadow-2xl border border-neutral-800 my-2 text-left" dir="ltr">
    <div class="flex justify-between items-center pb-2 border-b border-neutral-800">
      <div class="flex space-x-2">
        <div class="w-3 h-3 rounded-full bg-red-500"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
        <div class="w-3 h-3 rounded-full bg-green-500"></div>
      </div>
      <p class="text-xs text-neutral-400 font-semibold tracking-wider">CONSOLE LOGS</p>
    </div>
    
    <div id="logs" class="mt-3 text-xs leading-relaxed space-y-1 max-h-40 overflow-y-auto">
      <p class="text-neutral-500">// آماده به کار...</p>
    </div>
  </aside>

  <!-- اسکریپت اصلی و هندل کردن صدا -->
  <script>
    const socket = io();
    let localStream = null;
    let username = '';
    const peerConnections = {};
    const peersAudio = {};
    const MAX_DISTANCE = 25.0;

    const rtcConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    function log(msg) {
      const logsDiv = document.getElementById('logs');
      if (!logsDiv) return;
      const p = document.createElement('p');
      p.className = 'text-green-400';
      p.innerHTML = `<span class="text-neutral-500">[${new Date().toLocaleTimeString()}]</span> <span class="text-yellow-400">$</span> ${msg}`;
      logsDiv.appendChild(p);
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    // پخش کننده بی‌صدا برای زنده نگه‌داشتن تب در گوشی
    function startKeepAlive() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      gain.gain.value = 0.00001; 
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
    }

    document.getElementById('joinBtn').addEventListener('click', async () => {
      const inputVal = document.getElementById('usernameInput').value.trim();
      if (!inputVal) return alert('لطفاً نام بازیکن را وارد کنید!');

      username = inputVal.toLowerCase();

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }, 
          video: false 
        });
        log('میکروفون متصل شد (حذف اکو فعال است)');
      } catch (err) {
        alert('دسترسی به میکروفون رد شد!');
        log('خطای میکروفون: ' + err.message);
        return;
      }

      startKeepAlive();
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('voiceSection').style.display = 'block';
      document.getElementById('userGreeting').innerText = `بازیکن: ${inputVal}`;

      socket.emit('join_voice', { username: username });
    });

    socket.on('user_list', (users) => {
      const list = document.getElementById('peersList');
      list.innerHTML = '';
      users.forEach(u => {
        if (u !== username) {
          const li = document.createElement('li');
          li.innerText = '• ' + u;
          list.appendChild(li);
        }
      });
      if (list.children.length === 0) {
        list.innerHTML = '<li>هیچ بازیکنی متصل نیست</li>';
      }
    });

    socket.on('user_joined', async ({ id, username: remoteUser }) => {
      log(`کاربر وارد شد: ${remoteUser}`);
      const pc = createPeerConnection(id, remoteUser);
      peerConnections[id] = pc;

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('offer', { target: id, offer: offer });
    });

    socket.on('offer', async ({ sender, offer, username: remoteUser }) => {
      const pc = createPeerConnection(sender, remoteUser);
      peerConnections[sender] = pc;

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      socket.emit('answer', { target: sender, answer: answer });
    });

    socket.on('answer', async ({ sender, answer }) => {
      const pc = peerConnections[sender];
      if (pc) {
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
      }
    });

    socket.on('ice_candidate', async ({ sender, candidate }) => {
      const pc = peerConnections[sender];
      if (pc && candidate) {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      }
    });

    socket.on('user_left', ({ id, username: remoteUser }) => {
      log(`کاربر خارج شد: ${remoteUser}`);
      if (peerConnections[id]) {
        peerConnections[id].close();
        delete peerConnections[id];
      }
      if (peersAudio[remoteUser]) {
        peersAudio[remoteUser].pause();
        delete peersAudio[remoteUser];
      }
    });

    function createPeerConnection(targetId, targetUsername) {
      const pc = new RTCPeerConnection(rtcConfig);

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          socket.emit('ice_candidate', { target: targetId, candidate: e.candidate });
        }
      };

      pc.ontrack = (e) => {
        log(`دریافت استریم صدا از: ${targetUsername}`);
        let audio = peersAudio[targetUsername];
        if (!audio) {
          audio = new Audio();
          audio.autoplay = true;
          peersAudio[targetUsername] = audio;
        }
        audio.srcObject = e.streams[0];
      };

      return pc;
    }

    // آپدیت موقعیت مکانی و فاصله مجاورتی (Proximity)
    socket.on('positions_update', (positions) => {
      const lowerPositions = {};
      for (let k in positions) {
        lowerPositions[k.toLowerCase()] = positions[k];
      }

      const myPos = lowerPositions[username];
      const statusDiv = document.getElementById('statusDiv');

      if (myPos) {
        statusDiv.innerText = `موقعیت: X:${Math.round(myPos.x)} Y:${Math.round(myPos.y)} Z:${Math.round(myPos.z)} (${myPos.world})`;
      } else {
        statusDiv.innerText = `در انتظار دریافت موقعیت شما از بازی...`;
      }

      for (const [targetName, audio] of Object.entries(peersAudio)) {
        const targetPos = lowerPositions[targetName.toLowerCase()];

        if (!myPos || !targetPos || myPos.world !== targetPos.world) {
          audio.volume = 0;
          continue;
        }

        const dx = myPos.x - targetPos.x;
        const dy = myPos.y - targetPos.y;
        const dz = myPos.z - targetPos.z;
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

        if (dist >= MAX_DISTANCE) {
          audio.volume = 0;
        } else {
          audio.volume = Math.max(0, Math.min(1, 1 - (dist / MAX_DISTANCE)));
        }
      }
    });
  </script>
</body>
</html>
