<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویس‌چت فاصله‌محور ماینکرفت</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #121218; color: #fff; text-align: center; padding-top: 30px; }
        .card { background: #1e1e2a; max-width: 400px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input, button { padding: 12px 16px; border-radius: 8px; border: none; font-size: 16px; margin: 8px 0; width: 85%; }
        button { background: #00b894; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #00a383; }
        button.danger { background: #d63031; }
        .hidden { display: none; }
        #status { margin-top: 15px; color: #aaa; font-size: 14px; }
        #players-list { margin-top: 15px; text-align: right; background: #161622; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>ویس‌چت پاکت‌ماین</h2>
        <div id="login-box">
            <p>نام دقیق کاراکتر بازی خود را وارد کنید:</p>
            <input type="text" id="username" placeholder="گیمرتگ (مثلاً Steve)">
            <button onclick="startVoice()">اتصال به ویس</button>
        </div>

        <div id="control-box" class="hidden">
            <h3 id="my-name"></h3>
            <button id="mute-btn" onclick="toggleMute()">قطع میکروفون (Mute)</button>
            <div id="status">در انتظار دریافت مختصات از سرور بازی...</div>
            <div id="players-list"><strong>افراد متصل:</strong></div>
        </div>
    </div>

    <!-- تگ کمکی برای بیدار نگه داشتن صدای مرورگر در پس‌زمینه اندروید -->
    <audio id="keepAlive" loop></audio>

    <script>
        const socket = io();
        let localStream = null;
        let myId = null;
        const peers = {}; // socketId -> RTCPeerConnection
        const gainNodes = {}; // socketId -> GainNode
        const MAX_DISTANCE = 25; // حداکثر فاصله شنیدن صدا (بلاک)

        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        async function startVoice() {
            const rawName = document.getElementById('username').value.trim();
            if (!rawName) return alert('لطفاً نام خود را وارد کنید');

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                // پخش صدای بی‌صدا برای پس‌زمینه
                const keepAlive = document.getElementById('keepAlive');
                keepAlive.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
                keepAlive.play().catch(() => {});

                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('control-box').classList.remove('hidden');
                document.getElementById('my-name').innerText = "ورود با: " + rawName;

                socket.emit('join', rawName);
            } catch (err) {
                alert('دسترسی به میکروفون داده نشد یا خطایی رخ داد: ' + err.message);
            }
        }

        socket.on('joined', (data) => {
            myId = data.id;
        });

        socket.on('players_list', (players) => {
            for (const id in players) {
                if (id !== myId && !peers[id]) {
                    initiatePeerConnection(id, true);
                }
            }
            updatePlayersUI(players);
        });

        socket.on('player_left', (id) => {
            if (peers[id]) {
                peers[id].close();
                delete peers[id];
                delete gainNodes[id];
            }
        });

        socket.on('signal', async (data) => {
            let pc = peers[data.sender];
            if (!pc) {
                pc = initiatePeerConnection(data.sender, false);
            }

            if (data.signal.sdp) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                if (data.signal.sdp.type === 'offer') {
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    socket.emit('signal', { target: data.sender, signal: { sdp: pc.localDescription } });
                }
            } else if (data.signal.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
            }
        });

        function initiatePeerConnection(targetId, isInitiator) {
            const pc = new RTCPeerConnection(rtcConfig);
            peers[targetId] = pc;

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('signal', { target: targetId, signal: { candidate: event.candidate } });
                }
            };

            pc.ontrack = (event) => {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(event.streams[0]);
                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 0; // در ابتدا صدا بسته است تا مختصات سنجیده شود

                source.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNodes[targetId] = gainNode;
            };

            if (isInitiator) {
                pc.onnegotiationneeded = async () => {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    socket.emit('signal', { target: targetId, signal: { sdp: pc.localDescription } });
                };
            }

            return pc;
        }

        // پردازش فاصله و تنظیم ولوم صدا
        socket.on('positions_update', (players) => {
            if (!myId || !players[myId]) return;
            const me = players[myId];

            if (me.x === null) {
                document.getElementById('status').innerText = "منتظر حضور کاراکتر شما در سرور ماینکرفت...";
                return;
            }

            document.getElementById('status').innerText = `متصل به بازی در موقعیت: X:${Math.round(me.x)} Y:${Math.round(me.y)} Z:${Math.round(me.z)}`;

            for (const [id, target] of Object.entries(players)) {
                if (id === myId || !gainNodes[id]) continue;

                if (target.world !== me.world || target.x === null) {
                    gainNodes[id].gain.value = 0;
                    continue;
                }

                // فرمول فاصله اقلیدسی ۳ بعدی
                const dx = me.x - target.x;
                const dy = me.y - target.y;
                const dz = me.z - target.z;
                const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);

                if (distance > MAX_DISTANCE) {
                    gainNodes[id].gain.value = 0; // خارج از محدوده شنیدن
                } else {
                    // تغییر ولوم از ۱ (فاصله صفر) تا ۰ (فاصله ۲۵)
                    const volume = Math.max(0, 1 - (distance / MAX_DISTANCE));
                    gainNodes[id].gain.value = volume;
                }
            }
        });

        function updatePlayersUI(players) {
            const listDiv = document.getElementById('players-list');
            listDiv.innerHTML = '<strong>افراد آنلاین در روم:</strong><br>';
            for (const id in players) {
                listDiv.innerHTML += `• ${players[id].username} ${id === myId ? '(شما)' : ''}<br>`;
            }
        }

        let isMuted = false;
        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            const btn = document.getElementById('mute-btn');
            btn.innerText = isMuted ? "وصل میکروفون (Unmute)" : "قطع میکروفون (Mute)";
            btn.classList.toggle('danger', isMuted);
        }
    </script>
</body>
</html>
