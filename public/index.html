<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hivemc Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #050505;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* هاله‌های نوری محیطی (Ambient Glow) برای عمق بخشیدن به صفحه */
    .ambient-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 1;
    }
    .glow-cyan {
      background: #38bdf8;
      top: 10%;
      left: 15%;
    }
    .glow-purple {
      background: #a855f7;
      bottom: 10%;
      right: 15%;
    }

    /* پس‌زمینه با مربع‌های چرخان چندرنگ */
    .bg-squares {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    
    .bg-squares span {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      bottom: -150px;
      animation: floatUp 22s infinite linear;
      border-radius: 8px;
      overflow: hidden;
      padding: 2px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .bg-squares span::before {
      content: '';
      position: absolute;
      width: 250%;
      height: 250%;
      background: conic-gradient(transparent, var(--box-color, #38bdf8), transparent 200deg);
      animation: rotateSquareBorder 3s linear infinite;
    }

    .bg-squares span::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: rgba(10, 10, 10, 0.85);
      border-radius: 6px;
      z-index: 1;
    }

    @keyframes rotateSquareBorder {
      100% { transform: rotate(360deg); }
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      20% { opacity: 0.85; }
      80% { opacity: 0.85; }
      100% { transform: translateY(-1200px) rotate(540deg); opacity: 0; }
    }

    /* ۱۰ مربع رنگارنگ با زمان‌بندی و موقعیت‌های متنوع */
    .bg-squares span:nth-child(1) { left: 6%; width: 42px; height: 42px; animation-duration: 18s; --box-color: #ffffff; }
    .bg-squares span:nth-child(2) { left: 18%; width: 28px; height: 28px; animation-duration: 24s; animation-delay: 2s; --box-color: #10b981; }
    .bg-squares span:nth-child(3) { left: 32%; width: 50px; height: 50px; animation-duration: 21s; animation-delay: 4s; --box-color: #a855f7; }
    .bg-squares span:nth-child(4) { left: 45%; width: 34px; height: 34px; animation-duration: 26s; animation-delay: 1s; --box-color: #f59e0b; }
    .bg-squares span:nth-child(5) { left: 58%; width: 44px; height: 44px; animation-duration: 19s; animation-delay: 6s; --box-color: #ec4899; }
    .bg-squares span:nth-child(6) { left: 70%; width: 30px; height: 30px; animation-duration: 22s; animation-delay: 3s; --box-color: #06b6d4; }
    .bg-squares span:nth-child(7) { left: 82%; width: 48px; height: 48px; animation-duration: 20s; animation-delay: 7s; --box-color: #e11d48; }
    .bg-squares span:nth-child(8) { left: 92%; width: 36px; height: 36px; animation-duration: 25s; animation-delay: 5s; --box-color: #84cc16; }
    .bg-squares span:nth-child(9) { left: 14%; width: 38px; height: 38px; animation-duration: 23s; animation-delay: 9s; --box-color: #6366f1; }
    .bg-squares span:nth-child(10) { left: 64%; width: 26px; height: 26px; animation-duration: 17s; animation-delay: 8s; --box-color: #14b8a6; }

    /* کارت مرکزی با شیشه دودی و حاشیه نوری ظریف */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(14, 14, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 36px 30px;
      width: 92%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-align: center;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
      box-shadow: 0 30px 60px -12px rgba(56, 189, 248, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* تیتر Hivemc با افکت متنی گرادیان نوری */
    .brand-title {
      background: linear-gradient(135deg, #ffffff 40%, #7dd3fc 80%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
      letter-spacing: 2px;
    }

    /* دکمه با خط مرزی گردان */
    .rotating-border-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2.5px;
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    .rotating-border-btn:active {
      transform: scale(0.98);
    }
    .rotating-border-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(transparent, #38bdf8, transparent 210deg);
      animation: rotateBorder 3.5s linear infinite;
    }
    @keyframes rotateBorder {
      100% { transform: rotate(360deg); }
    }
    .rotating-border-btn span {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #090d16;
      border-radius: 10px;
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.2s, color 0.2s;
    }
    .rotating-border-btn:hover span {
      background: #0f172a;
    }

    /* دکمه ورود مستقیم به ماینکرفت (Deep-link) */
    .quick-join-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 42px;
      margin-top: 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      text-decoration: none;
    }
    .quick-join-btn:hover {
      background: rgba(56, 189, 248, 0.1);
      border-color: rgba(56, 189, 248, 0.3);
      color: #38bdf8;
    }

    /* دکمه‌های شبکه‌های اجتماعی پایین کارت */
    .social-btn {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      transition: all 0.2s;
      text-decoration: none;
    }
    .social-btn:hover {
      color: #fff;
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* سوئیچ زبان */
    .lang-switcher {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 20;
      display: flex;
      gap: 5px;
      background: rgba(15, 15, 20, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 4px;
      backdrop-filter: blur(8px);
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: #38bdf8;
      color: #050505;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    /* باکس وضعیت آنلاین سرور */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 20px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }
    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseDot 2s infinite;
    }
    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <!-- هاله‌های نوری محو پشت صحنه -->
  <div class="ambient-glow glow-cyan"></div>
  <div class="ambient-glow glow-purple"></div>

  <!-- تغییر زبان -->
  <div class="lang-switcher">
    <button class="lang-btn active" id="btn-en" onclick="setLanguage('en')">EN</button>
    <button class="lang-btn" id="btn-fa" onclick="setLanguage('fa')">FA</button>
  </div>

  <!-- پس‌زمینه شناور مربعی (۱۰ تایی با رنگ‌های مختلف) -->
  <div class="bg-squares">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- کارت مرکزی -->
  <div class="card">
    <div class="status-badge">
      <span class="status-dot" id="server-dot"></span>
      <span id="server-status-text" data-i18n="checking">Checking server...</span>
    </div>

    <!-- لوگو و آیکون مکعبی سرور -->
    <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/30">
      <i class="fa-solid fa-cube text-white text-2xl"></i>
    </div>

    <h1 class="brand-title text-4xl font-black mb-1">HIVEMC</h1>
    <p class="text-xs text-slate-400 mb-6 font-medium" data-i18n="subtitle">Official Bedrock & PocketMine Server</p>

    <!-- کادر اطلاعات سرور -->
    <div class="bg-black/60 border border-white/5 rounded-2xl p-4 mb-4 text-left shadow-inner">
      <div class="flex justify-between items-center text-sm py-1.5 border-b border-white/5">
        <span class="text-slate-400 text-xs font-medium" data-i18n="lbl_ip">Server IP:</span>
        <span class="font-mono text-sky-400 select-all font-semibold">sv2.tgmc.ir</span>
      </div>
      <div class="flex justify-between items-center text-sm py-1.5 border-b border-white/5 mt-1">
        <span class="text-slate-400 text-xs font-medium" data-i18n="lbl_port">Port:</span>
        <span class="font-mono text-sky-400 select-all font-semibold">27235</span>
      </div>
      <div class="flex justify-between items-center text-sm py-1.5 mt-1">
        <span class="text-slate-400 text-xs font-medium" data-i18n="lbl_players">Players Online:</span>
        <span id="player-count" class="font-mono font-bold text-emerald-400 text-sm">0 / 0</span>
      </div>
    </div>

    <!-- دکمه کپی آدرس سرور با افکت چرخان -->
    <div class="rotating-border-btn" onclick="copyServerAddress()">
      <span id="btn-copy-text" data-i18n="btn_copy">
        <i class="fa-regular fa-copy text-sky-400"></i> Copy Server IP
      </span>
    </div>

    <!-- دکمه ورود مستقیم به بازی (مخصوص بازیکنان گوشی) -->
    <a href="minecraft://?addExternalServer=Hivemc|sv2.tgmc.ir:27235" class="quick-join-btn">
      <i class="fa-solid fa-gamepad text-xs"></i>
      <span data-i18n="quick_join">Direct Play / Add to Game</span>
    </a>

    <!-- بخش شبکه‌های اجتماعی سرور -->
    <div class="mt-5 pt-4 border-t border-white/5 flex items-center justify-center gap-3">
      <a href="#" class="social-btn" title="Discord"><i class="fa-brands fa-discord"></i></a>
      <a href="#" class="social-btn" title="Telegram"><i class="fa-brands fa-telegram"></i></a>
      <a href="#" class="social-btn" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
    </div>
  </div>

  <script>
    const translations = {
      en: {
        checking: "Checking server...",
        online: "Server Online",
        offline: "Server Offline",
        subtitle: "Official Bedrock & PocketMine Server",
        lbl_ip: "Server IP:",
        lbl_port: "Port:",
        lbl_players: "Players Online:",
        btn_copy: '<i class="fa-regular fa-copy text-sky-400"></i> Copy Server IP',
        copied: '<i class="fa-solid fa-check text-emerald-400"></i> Copied to Clipboard!',
        quick_join: "Direct Play / Add to Game"
      },
      fa: {
        checking: "در حال بررسی سرور...",
        online: "سرور فعال است",
        offline: "سرور آفلاین است",
        subtitle: "سرور رسمی بدراک و پاکت‌ماین",
        lbl_ip: "آدرس سرور:",
        lbl_port: "پورت سرور:",
        lbl_players: "بازیکنان آنلاین:",
        btn_copy: '<i class="fa-regular fa-copy text-sky-400"></i> کپی آدرس سرور',
        copied: '<i class="fa-solid fa-check text-emerald-400"></i> آدرس کپی شد!',
        quick_join: "اتصال مستقیم / افزودن به ماینکرفت"
      }
    };

    let currentLang = localStorage.getItem('hivemc_lang') || 'en';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('hivemc_lang', lang);
      document.documentElement.dir = (lang === 'fa') ? 'rtl' : 'ltr';
      document.documentElement.lang = lang;

      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('btn-fa').classList.toggle('active', lang === 'fa');

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.innerHTML = translations[lang][key];
        }
      });
    }

    async function updateServerStatus() {
      try {
        const res = await fetch('/api/server-status');
        const data = await res.json();
        
        const dot = document.getElementById('server-dot');
        const statusText = document.getElementById('server-status-text');
        const playerCount = document.getElementById('player-count');

        if (data.online) {
          dot.className = "status-dot online";
          statusText.setAttribute('data-i18n', 'online');
          statusText.innerHTML = translations[currentLang].online;
          playerCount.innerText = `${data.currentPlayers} / ${data.maxPlayers}`;
        } else {
          dot.className = "status-dot offline";
          statusText.setAttribute('data-i18n', 'offline');
          statusText.innerHTML = translations[currentLang].offline;
          playerCount.innerText = "0 / 0";
        }
      } catch (err) {
        document.getElementById('server-dot').className = "status-dot offline";
        const statusText = document.getElementById('server-status-text');
        statusText.setAttribute('data-i18n', 'offline');
        statusText.innerHTML = translations[currentLang].offline;
      }
    }

    function copyServerAddress() {
      navigator.clipboard.writeText("sv2.tgmc.ir:27235");
      const btnText = document.getElementById('btn-copy-text');
      const originalHtml = translations[currentLang].btn_copy;
      btnText.innerHTML = translations[currentLang].copied;
      setTimeout(() => {
        btnText.innerHTML = originalHtml;
      }, 2500);
    }

    setLanguage(currentLang);
    updateServerStatus();
    setInterval(updateServerStatus, 5000);
  </script>
</body>
</html>
