<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proximity Voice Chat</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050505;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Squares Background */
    .bg-squares {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .bg-squares li {
      position: absolute;
      display: block;
      list-style: none;
      width: 20px;
      height: 20px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      animation: animate 25s linear infinite;
      bottom: -150px;
      border-radius: 4px;
    }

    .bg-squares li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
    .bg-squares li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
    
          .bg-squares li:nth-child(3) {
      left: 70%;
      width: 20px;
      height: 20px;
      animation-delay: 4s;
    }

    .bg-squares li:nth-child(4) {
      left: 40%;
      width: 60px;
      height: 60px;
      animation-delay: 0s;
      animation-duration: 18s;
    }

    .bg-squares li:nth-child(5) {
      left: 65%;
      width: 20px;
      height: 20px;
      animation-delay: 0s;
    }

    .bg-squares li:nth-child(6) {
      left: 75%;
      width: 110px;
      height: 110px;
      animation-delay: 3s;
    }

    .bg-squares li:nth-child(7) {
      left: 35%;
      width: 150px;
      height: 150px;
      animation-delay: 7s;
    }

    .bg-squares li:nth-child(8) {
      left: 50%;
      width: 25px;
      height: 25px;
      animation-delay: 15s;
      animation-duration: 45s;
    }

    @keyframes animate {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-1000px) rotate(720deg);
        opacity: 0;
      }
    }

    .page-content {
      position: relative;
      z-index: 1;
      width: min(100% - 32px, 390px);
    }

    .card {
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      background: rgba(18, 18, 18, 0.92);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .card h1 {
      margin-bottom: 10px;
      color: #fff;
      font-size: 24px;
    }

    .subtitle {
      margin-bottom: 24px;
      color: #9ca3af;
      font-size: 14px;
    }

    .username-input {
      width: 100%;
      padding: 14px;
      border: 1px solid #454545;
      border-radius: 10px;
      outline: none;
      background: #080808;
      color: #fff;
      text-align: center;
      font-size: 16px;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .username-input:focus {
      border-color: #fff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
    }

    .rotating-border-btn {
      position: relative;
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 2px;
      overflow: hidden;
      border: 0;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      isolation: isolate;
    }

    .rotating-border-btn::before {
      position: absolute;
      z-index: -1;
      top: -150%;
      left: -25%;
      width: 150%;
      height: 400%;
      background: conic-gradient(
        transparent 0deg,
        transparent 250deg,
        #00e5ff 285deg,
        #a855f7 320deg,
        #fff 350deg,
        transparent 360deg
      );
      content: "";
      animation: rotateBorder 3s linear infinite;
    }

    .rotating-border-btn span {
      display: block;
      padding: 13px;
      border-radius: 10px;
      background: #fff;
      color: #050505;
      font-weight: 700;
      font-size: 16px;
      transition: background 0.2s;
    }

    .rotating-border-btn:hover span {
      background: #eaeaea;
    }

    @keyframes rotateBorder {
      to { transform: rotate(360deg); }
    }

    #status {
      min-height: 22px;
      margin-top: 16px;
      color: #a3a3a3;
      font-size: 13px;
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-squares li,
      .rotating-border-btn::before {
        animation: none;
      }
    }
  </style>
</head>
