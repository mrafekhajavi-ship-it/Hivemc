<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Proximity Voice Chat</title>
  
  <!-- Tailwind CSS for clean layout -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Socket.io client -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    body {
      background-color: #0b0f19;
      background-image: 
        radial-gradient(at 10% 20%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: rgba(26, 29, 36, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      text-align: center;
      margin-bottom: 20px;
    }

    /* Uiverse Input styling */ 
    .container {
      margin: 20px auto 10px auto;
      padding: 0;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      direction: ltr;
    }

    .label {
      position: relative;
      display: flex;
      align-items: center;
      width: 280px;
      border-radius: 8px;
      border: 2px solid #373737;
      padding: 12px 14px;
      text-align: left;
      background: #0f1117;
      transition: all 0.3s ease;
    }

    /* White glow on focus */
    .label:focus-within {
      border-color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
    }

    .label .icon {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      transition: all 0.3s ease;
      color: #71717a;
      pointer-events: none;
    }

    .label:focus-within .icon {
      color: #ffffff;
    }

    .label .input {
      background-color: transparent;
      outline: none;
      border: none;
      color: #e2e8f0;
      font-size: 15px;
      width: 100%;
      padding-right: 32px;
      font-family: inherit;
    }

    .label .input::placeholder {
      color: #52525b;
    }

    .label .input:focus {
      color: #ffffff;
    }

    /* Cyberpunk Glowing Button */
    .button {
      position: relative;
      cursor: pointer;
      border: none;
      width: 150px;
      height: 44px;
      background: #111;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .text {
      position: relative;
      z-index: 1;
    }

    .button::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      background: radial-gradient(circle at 50% 50%, #0000 0, #0000 20%, #111111aa 50%),
                  radial-gradient(ellipse 100% 100%, #fff, #fff0);
      background-size: 3px 3px, auto auto;
      transition: 0.3s;
    }

    .button:hover::before {
      opacity: 0.3;
    }

    .a {
      pointer-events: none;
      position: absolute;
      --w: 2px;
      --t: -40px;
      --s: calc(var(--t) * -1);
      --e: calc(100% + var(--t));
      --g: #fff0, #fff3 var(--s), #fffa var(--s), #fff, #fffa var(--e), #fff3 var(--e), #fff0;
    }

    .a::before {
      content: "";
      position: absolute;
      inset: 0;
      background: inherit;
      filter: blur(4px);
      z-index: -2;
    }

    .a::after {
      content: "";
      position: absolute;
      inset: 0;
      background: inherit;
      filter: blur(10px);
      opacity: 0;
      z-index: -2;
      transition: 0.3s;
    }

    .button:hover .a::after {
      opacity: 1;
    }

    .l { left: -2px; }
    .r { right: -2px; }
    .l, .r {
      background: linear-gradient(var(--g));
      top: var(--t);
      bottom: var(--t);
      width: var(--w);
    }

    .t { top: -2px; }
    .b { bottom: -2px; }
    .t, .b {
      background: linear-gradient(90deg, var(--g));
      left: var(--t);
      right: var(--t);
      height: var(--w);
    }
  </style>
</head>
<body>

  <!-- Login Section -->
  <div class="card" id="loginSection">
    <h1 style="font-size: 22px; margin-bottom: 6px; font-weight: bold; letter-spacing: -0.5px;">PROXIMITY VOICE CHAT</h1>
    <p style="font-size: 13px; color: #a0aec0;">Enter your in-game Minecraft username</p>
    
    <div class="container">
      <label class="label">
        <input type="text" id="usernameInput" class="input" placeholder="Minecraft Username..." autocomplete="off" />
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </label>
    </div>

    <button id="joinBtn" class="button">
      <span class="text">CONNECT</span>
      <span class="a t"></span>
      <span class="a r"></span>
      <span class="a b"></span>
      <span class="a l"></span>
    </button>
  </div>

  <!-- Connected Session Section -->
  <div class="card" id="voiceSection" style="display: none;">
    <h2 id="userGreeting" style="font-size: 18px; font-weight: bold; color: #4ade80;">Connected</h2>
    <div id="statusDiv" class="text-xs text-yellow-400 mt-2 font-mono">Waiting for in-game coordinates...</div>

    <div style="margin-top: 24px; text-align: left;">
      <h3 style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; margin-bottom: 10px;">Connected Players:</h3>
      <ul id="peersList" style="list-style: none; padding: 0; margin: 0; font-size: 13px; color: #cbd5e1; space-y-1">
        <li class="text-neutral-500 italic">No players connected</li>
      </ul>
    </div>
  </div>

  <!-- Terminal Logs -->
  <aside class="bg-black/90 backdrop-blur-md text-white p-5 rounded-xl w-full max-w-lg font-mono shadow-2xl border border-neutral-800 my-2 text-left" dir="ltr">
    <div class="flex justify-between items-center pb-2 border-b border-neutral-800">
      <div class="flex space-x-2">
        <div class="w-3 h-3 rounded-full bg-red-500"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
        <div class="w-3 h-3 rounded-full bg-green-500"></div>
      </div>
      <p class="text-xs text-neutral-400 font-semibold tracking-wider">CONSOLE LOGS</p>
    </div>
    
    <div id="logs" class="mt-3 text-xs leading-relaxed space-y-1 max-h-40 overflow-y-auto">
      <p class="text-neutral-500">// Ready to connect...</p>
    </div>
  </aside>

  <!-- WebRTC & Socket Client Logic -->
  <script>
    const socket = io();
    let localStream = null;
    let username = '';
    const peerConnections = {};
    const peersAudio = {};
    const MAX_DISTANCE = 25.0;

    const rtcConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    function log(msg) {
      const logsDiv = document.getElementById('logs');
      if (!logsDiv) return;
      const p = document.createElement('p');
      p.className = 'text-green-400';
      p.innerHTML = `<span class="text-neutral-500">[${new Date().toLocaleTimeString()}]</span> <span class="text-yellow-400">$</span> ${msg}`;
      logsDiv.appendChild(p);
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    function startKeepAlive() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      gain.gain.value = 0.00001; 
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
    }

    document.getElementById('joinBtn').addEventListener('click', async () => {
      const inputVal = document.getElementById('usernameInput').value.trim();
      if (!inputVal) return alert('Please enter your Minecraft username!');

      username = inputVal.toLowerCase();

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }, 
          video: false 
        });
        log('Microphone initialized (AEC & NS enabled)');
      } catch (err) {
        alert('Microphone access denied!');
        log('Microphone error: ' + err.message);
        return;
      }

      startKeepAlive();
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('voiceSection').style.display = 'block';
      document.getElementById('userGreeting').innerText = `Player: ${inputVal}`;

      socket.emit('join_voice', { username: username });
    });

    socket.on('user_list', (users) => {
      const list = document.getElementById('peersList');
      list.innerHTML = '';
      users.forEach(u => {
        if (u !== username) {
          const li = document.createElement('li');
          li.innerText = '• ' + u;
          list.appendChild(li);
        }
      });
      if (list.children.length === 0) {
        list.innerHTML = '<li class="text-neutral-500 italic">No players connected</li>';
      }
    });

    socket.on('user_joined', async ({ id, username: remoteUser }) => {
      log(`Player connected: ${remoteUser}`);
      const pc = createPeerConnection(id, remoteUser);
      peerConnections[id] = pc;

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('offer', { target: id, offer: offer });
    });

    socket.on('offer', async ({ sender, offer, username: remoteUser }) => {
      const pc = createPeerConnection(sender, remoteUser);
      peerConnections[sender] = pc;

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      socket.emit('answer', { target: sender, answer: answer });
    });

    socket.on('answer', async ({ sender, answer }) => {
      const pc = peerConnections[sender];
      if (pc) {
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
      }
    });

    socket.on('ice_candidate', async ({ sender, candidate }) => {
      const pc = peerConnections[sender];
      if (pc && candidate) {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      }
    });

    socket.on('user_left', ({ id, username: remoteUser }) => {
      log(`Player disconnected: ${remoteUser}`);
      if (peerConnections[id]) {
        peerConnections[id].close();
        delete peerConnections[id];
      }
      if (peersAudio[remoteUser]) {
        peersAudio[remoteUser].pause();
        delete peersAudio[remoteUser];
      }
    });

    function createPeerConnection(targetId, targetUsername) {
      const pc = new RTCPeerConnection(rtcConfig);

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          socket.emit('ice_candidate', { target: targetId, candidate: e.candidate });
        }
      };

      pc.ontrack = (e) => {
        log(`Receiving audio stream from: ${targetUsername}`);
        let audio = peersAudio[targetUsername];
        if (!audio) {
          audio = new Audio();
          audio.autoplay = true;
          peersAudio[targetUsername] = audio;
        }
        audio.srcObject = e.streams[0];
      };

      return pc;
    }

    // 3D Proximity distance calculation
    socket.on('positions_update', (positions) => {
      const lowerPositions = {};
      for (let k in positions) {
        lowerPositions[k.toLowerCase()] = positions[k];
      }

      const myPos = lowerPositions[username];
      const statusDiv = document.getElementById('statusDiv');

      if (myPos) {
        statusDiv.innerText = `Pos: X:${Math.round(myPos.x)} Y:${Math.round(myPos.y)} Z:${Math.round(myPos.z)} (${myPos.world})`;
      } else {
        statusDiv.innerText = `Waiting for player position...`;
      }

      for (const [targetName, audio] of Object.entries(peersAudio)) {
        const targetPos = lowerPositions[targetName.toLowerCase()];

        if (!myPos || !targetPos || myPos.world !== targetPos.world) {
          audio.volume = 0;
          continue;
        }

        const dx = myPos.x - targetPos.x;
        const dy = myPos.y - targetPos.y;
        const dz = myPos.z - targetPos.z;
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

        if (dist >= MAX_DISTANCE) {
          audio.volume = 0;
        } else {
          audio.volume = Math.max(0, Math.min(1, 1 - (dist / MAX_DISTANCE)));
        }
      }
    });
  </script>
</body>
</html>
