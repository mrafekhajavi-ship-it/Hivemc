<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Proximity Voice Chat</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Socket.io client (served by your backend via Worker proxy) -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #050505;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* Floating squares background */
    .bg-squares {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .bg-squares li {
      position: absolute;
      display: block;
      list-style: none;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 4px;
      bottom: -150px;
      animation: animateSquares 20s linear infinite;
    }
    .bg-squares li:nth-child(1)  { left: 25%; width: 70px; height: 70px; animation-delay: 0s;  animation-duration: 18s; }
    .bg-squares li:nth-child(2)  { left: 10%; width: 25px; height: 25px; animation-delay: 2s;  animation-duration: 12s; }
    .bg-squares li:nth-child(3)  { left: 70%; width: 20px; height: 20px; animation-delay: 4s;  animation-duration: 14s; }
    .bg-squares li:nth-child(4)  { left: 40%; width: 60px; height: 60px; animation-delay: 0s;  animation-duration: 16s; }
    .bg-squares li:nth-child(5)  { left: 65%; width: 35px; height: 35px; animation-delay: 1s;  animation-duration: 15s; }
    .bg-squares li:nth-child(6)  { left: 85%; width: 90px; height: 90px; animation-delay: 3s;  animation-duration: 22s; }
    .bg-squares li:nth-child(7)  { left: 32%; width: 110px; height: 110px; animation-delay: 7s; animation-duration: 25s; }
    .bg-squares li:nth-child(8)  { left: 55%; width: 25px; height: 25px; animation-delay: 12s; animation-duration: 19s; }
    .bg-squares li:nth-child(9)  { left: 20%; width: 18px; height: 18px; animation-delay: 3s;  animation-duration: 13s; }
    .bg-squares li:nth-child(10) { left: 90%; width: 80px; height: 80px; animation-delay: 9s;  animation-duration: 17s; }

    @keyframes animateSquares {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-115vh) rotate(540deg); opacity: 0; }
    }

    /* Content above background */
    .card, aside { position: relative; z-index: 10; }

    .card {
      background: rgba(18, 18, 22, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      text-align: center;
      margin-bottom: 20px;
    }

    /* Uiverse-style glow input */
    .container { margin: 20px auto 10px auto; display: flex; justify-content: center; align-items: center; }
    .label {
      position: relative;
      display: flex;
      align-items: center;
      width: 280px;
      border-radius: 8px;
      border: 2px solid #2e2e38;
      padding: 12px 14px;
      text-align: left;
      background: rgba(10, 10, 14, 0.85);
      transition: all 0.3s ease;
    }
    .label:focus-within {
      border-color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    }
    .label .icon {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      transition: all 0.3s ease;
      color: #71717a;
      pointer-events: none;
    }
    .label:focus-within .icon { color: #ffffff; }
    .label .input {
      background-color: transparent;
      outline: none;
      border: none;
      color: #e2e8f0;
      font-size: 15px;
      width: 100%;
      padding-right: 32px;
      font-family: inherit;
    }
    .label .input::placeholder { color: #52525b; }

    /* Cyberpunk button */
    .button {
      position: relative;
      cursor: pointer;
      border: none;
      width: 150px;
      height: 44px;
      background: #111;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .text { position: relative; z-index: 1; }
    .button::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      background:
        radial-gradient(circle at 50% 50%, #0000 0, #0000 20%, #111111aa 50%),
        radial-gradient(ellipse 100% 100%, #fff, #fff0);
      background-size: 3px 3px, auto auto;
      transition: 0.3s;
    }
    .button:hover::before { opacity: 0.3; }

    .a {
      pointer-events: none;
      position: absolute;
      --w: 2px;
      --t: -40px;
      --s: calc(var(--t) * -1);
      --e: calc(100% + var(--t));
      --g: #fff0, #fff3 var(--s), #fffa var(--s), #fff, #fffa var(--e), #fff3 var(--e), #fff0;
    }
    .a::before { content: ""; position: absolute; inset: 0; background: inherit; filter: blur(4px); z-index: -2; }
    .a::after  { content: ""; position: absolute; inset: 0; background: inherit; filter: blur(12px); z-index: -2; opacity: 0.5; }

    .top    { top: 0; left: 0; width: 100%; height: var(--w); background: linear-gradient(90deg,  var(--g)); animation: a-t 3s linear infinite; }
    .bottom { bottom: 0; left: 0; width: 100%; height: var(--w); background: linear-gradient(90deg, var(--g)); animation: a-b 3s linear infinite; }
    .left   { top: 0; left: 0; width: var(--w); height: 100%; background: linear-gradient(180deg, var(--g)); animation: a-l 3s linear infinite; }
    .right  { top: 0; right: 0; width: var(--w); height: 100%; background: linear-gradient(180deg, var(--g)); animation: a-r 3s linear infinite; }

    @keyframes a-t { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    @keyframes a-b { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    @keyframes a-l { 0% { transform: translateY(100%); } 100% { transform: translateY(-100%); } }
    @keyframes a-r { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }

    /* Terminal */
    .terminal {
      background: rgba(10, 10, 14, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-align: left;
    }
  </style>
</head>

<body>
  <!-- Background -->
  <ul class="bg-squares">
    <li></li><li></li><li></li><li></li><li></li>
    <li></li><li></li><li></li><li></li><li></li>
  </ul>

  <!-- Login -->
  <div class="card" id="loginSection">
    <h1 class="text-xl font-bold tracking-wider mb-2 text-white">PROXIMITY VOICE CHAT</h1>
    <p class="text-sm text-neutral-400 mb-6">Enter your Minecraft username to connect</p>

    <div class="container">
      <label class="label">
        <input type="text" id="usernameInput" class="input" placeholder="Username..." autocomplete="off" />
        <svg class="icon" xmlns="
                  <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </label>
    </div>

    <button class="button" id="joinBtn">
      <span class="a top"></span>
      <span class="a left"></span>
      <span class="a bottom"></span>
      <span class="a right"></span>
      <span class="text">CONNECT</span>
    </button>
  </div>

  <!-- Voice Chat Active Section -->
  <div class="card" id="voiceSection" style="display: none;">
    <h2 class="text-lg font-semibold text-emerald-400 mb-1" id="userGreeting">Player: ...</h2>
    <div id="statusDiv" class="text-xs text-neutral-400 font-mono mb-4">Initializing position...</div>
    
    <div class="text-left bg-black/40 rounded-lg p-3 border border-white/5 mb-4">
      <div class="text-xs font-semibold text-neutral-400 mb-2 uppercase tracking-wider">Connected Players:</div>
      <ul id="peersList" class="text-sm text-neutral-300 space-y-1 font-mono">
        <li class="text-neutral-500 italic">No players connected</li>
      </ul>
    </div>
  </div>

  <!-- Hacker Terminal Logs -->
  <aside class="w-full max-w-[460px]">
    <div class="terminal">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-white/10">
        <div class="flex items-center space-x-2">
          <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
          <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
          <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
        </div>
        <span class="text-xs text-neutral-500 font-mono">system.log</span>
      </div>
      <div id="logs" class="space-y-1.5 h-36 overflow-y-auto text-xs font-mono">
        <p class="text-neutral-500">[System] Initialized client interface successfully.</p>
      </div>
    </div>
  </aside>

  <script>
    const socket = io();
    let localStream = null;
    let username = '';
    const peerConnections = {};
    const peersAudio = {};
    const MAX_DISTANCE = 25.0;

    const rtcConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    function log(msg) {
      const logsDiv = document.getElementById('logs');
      if (!logsDiv) return;
      const p = document.createElement('p');
      p.className = 'text-green-400';
      p.innerHTML = `<span class="text-neutral-500">[${new Date().toLocaleTimeString()}]</span> <span class="text-yellow-400">$</span> ${msg}`;
      logsDiv.appendChild(p);
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    function startKeepAlive() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      gain.gain.value = 0.00001; 
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
    }

    document.getElementById('joinBtn').addEventListener('click', async () => {
      const inputVal = document.getElementById('usernameInput').value.trim();
      if (!inputVal) return alert('Please enter your Minecraft username!');

      username = inputVal.toLowerCase();

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }, 
          video: false 
        });
        log('Microphone initialized (AEC & NS enabled)');
      } catch (err) {
        alert('Microphone access denied!');
        log('Microphone error: ' + err.message);
        return;
      }

      startKeepAlive();
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('voiceSection').style.display = 'block';
      document.getElementById('userGreeting').innerText = `Player: ${inputVal}`;

      socket.emit('join_voice', { username: username });
    });

    socket.on('user_list', (users) => {
      const list = document.getElementById('peersList');
      list.innerHTML = '';
      users.forEach(u => {
        if (u !== username) {
          const li = document.createElement('li');
          li.innerText = '• ' + u;
          list.appendChild(li);
        }
      });
      if (list.children.length === 0) {
        list.innerHTML = '<li class="text-neutral-500 italic">No players connected</li>';
      }
    });

    socket.on('user_joined', async ({ id, username: remoteUser }) => {
      log(`Player connected: ${remoteUser}`);
      const pc = createPeerConnection(id, remoteUser);
      peerConnections[id] = pc;

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('offer', { target: id, offer: offer });
    });

    socket.on('offer', async ({ sender, offer, username: remoteUser }) => {
      const pc = createPeerConnection(sender, remoteUser);
      peerConnections[sender] = pc;

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      socket.emit('answer', { target: sender, answer: answer });
    });

    socket.on('answer', async ({ sender, answer }) => {
      const pc = peerConnections[sender];
      if (pc) {
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
      }
    });

    socket.on('ice_candidate', async ({ sender, candidate }) => {
      const pc = peerConnections[sender];
      if (pc && candidate) {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      }
    });

    socket.on('user_left', ({ id, username: remoteUser }) => {
      log(`Player disconnected: ${remoteUser}`);
      if (peerConnections[id]) {
        peerConnections[id].close();
        delete peerConnections[id];
      }
      if (peersAudio[remoteUser]) {
        peersAudio[remoteUser].pause();
        delete peersAudio[remoteUser];
      }
    });

    function createPeerConnection(targetId, targetUsername) {
      const pc = new RTCPeerConnection(rtcConfig);

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          socket.emit('ice_candidate', { target: targetId, candidate: e.candidate });
        }
      };

      pc.ontrack = (e) => {
        log(`Receiving audio stream from: ${targetUsername}`);
        let audio = peersAudio[targetUsername];
        if (!audio) {
          audio = new Audio();
          audio.autoplay = true;
          peersAudio[targetUsername] = audio;
        }
        audio.srcObject = e.streams[0];
      };

      return pc;
    }

    socket.on('positions_update', (positions) => {
      const lowerPositions = {};
      for (let k in positions) {
        lowerPositions[k.toLowerCase()] = positions[k];
      }

      const myPos = lowerPositions[username];
      const statusDiv = document.getElementById('statusDiv');

      if (myPos) {
        statusDiv.innerText = `Pos: X:${Math.round(myPos.x)} Y:${Math.round(myPos.y)} Z:${Math.round(myPos.z)} (${myPos.world})`;
      } else {
        statusDiv.innerText = `Waiting for player position...`;
      }

      for (const [targetName, audio] of Object.entries(peersAudio)) {
        const targetPos = lowerPositions[targetName.toLowerCase()];

        if (!myPos || !targetPos || myPos.world !== targetPos.world) {
          audio.volume = 0;
          continue;
        }

        const dx = myPos.x - targetPos.x;
        const dy = myPos.y - targetPos.y;
        const dz = myPos.z - targetPos.z;
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

        if (dist >= MAX_DISTANCE) {
          audio.volume = 0;
        } else {
          audio.volume = Math.max(0, Math.min(1, 1 - (dist / MAX_DISTANCE)));
        }
      }
    });
  </script>
</body>
</html>
