<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hivemc Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050505;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* پس‌زمینه مربعی شناور */
    .bg-squares {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .bg-squares span {
      position: absolute;
      display: block;
      width: 20px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      bottom: -150px;
      animation: floatUp 22s infinite linear;
      border-radius: 4px;
    }
    .bg-squares span:nth-child(1) { left: 10%; width: 40px; height: 40px; animation-duration: 18s; }
    .bg-squares span:nth-child(2) { left: 25%; width: 25px; height: 25px; animation-duration: 25s; animation-delay: 2s; }
    .bg-squares span:nth-child(3) { left: 45%; width: 50px; height: 50px; animation-duration: 20s; animation-delay: 4s; }
    .bg-squares span:nth-child(4) { left: 70%; width: 30px; height: 30px; animation-duration: 24s; animation-delay: 1s; }
    .bg-squares span:nth-child(5) { left: 85%; width: 45px; height: 45px; animation-duration: 19s; animation-delay: 5s; }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-1200px) rotate(720deg); opacity: 0; }
    }

    /* استایل کارت مرکزی */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(15, 15, 15, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 36px 28px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    /* دکمه با خط مرزی گردان */
    .rotating-border-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      border-radius: 12px;
      overflow: hidden;
      width: 75%;
      margin: 20px auto 0 auto;
      cursor: pointer;
      text-decoration: none;
    }
    .rotating-border-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(transparent, #38bdf8, transparent 210deg);
      animation: rotateBorder 4s linear infinite;
    }
    @keyframes rotateBorder {
      100% { transform: rotate(360deg); }
    }
    .rotating-border-btn span {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      border-radius: 9px;
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.5px;
      transition: background 0.2s, color 0.2s;
    }
    .rotating-border-btn:hover span {
      background: #1e293b;
      color: #7dd3fc;
    }

    /* سوئیچ تغییر زبان */
    .lang-switcher {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 20;
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 4px;
      backdrop-filter: blur(8px);
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: #38bdf8;
      color: #050505;
    }

    /* باکس وضعیت سرور */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 18px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }
    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }
  </style>
</head>
<body>

  <!-- تغییر زبان -->
  <div class="lang-switcher">
    <button class="lang-btn active" id="btn-en" onclick="setLanguage('en')">EN</button>
    <button class="lang-btn" id="btn-fa" onclick="setLanguage('fa')">FA</button>
  </div>

  <!-- پس‌زمینه شناور مربعی -->
  <div class="bg-squares">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- کارت مرکزی -->
  <div class="card">
    <div class="status-badge">
      <span class="status-dot" id="server-dot"></span>
      <span id="server-status-text" data-i18n="checking">Checking server...</span>
    </div>

    <h1 class="text-3xl font-extrabold text-white tracking-wider mb-2">HIVEMC</h1>
    <p class="text-sm text-slate-400 mb-6" data-i18n="subtitle">Official Bedrock & PocketMine Server</p>

    <!-- کادر اطلاعات سرور -->
    <div class="bg-black/50 border border-white/5 rounded-xl p-4 mb-3 text-left">
      <div class="flex justify-between items-center text-sm py-1 border-b border-white/5">
        <span class="text-slate-400" data-i18n="lbl_ip">Server IP:</span>
        <span class="font-mono text-sky-400 select-all font-semibold">sv2.tgmc.ir</span>
      </div>
      <div class="flex justify-between items-center text-sm py-1 border-b border-white/5 mt-1">
        <span class="text-slate-400" data-i18n="lbl_port">Port:</span>
        <span class="font-mono text-sky-400 select-all font-semibold">27235</span>
      </div>
      <div class="flex justify-between items-center text-sm py-1 mt-1">
        <span class="text-slate-400" data-i18n="lbl_players">Players Online:</span>
        <span id="player-count" class="font-mono font-bold text-emerald-400">0 / 0</span>
      </div>
    </div>

    <!-- دکمه کپی آدرس -->
    <div class="rotating-border-btn" onclick="copyServerAddress()">
      <span id="btn-copy-text" data-i18n="btn_copy">Copy Server IP</span>
    </div>
  </div>

  <script>
    const translations = {
      en: {
        checking: "Checking server...",
        online: "Server Online",
        offline: "Server Offline",
        subtitle: "Official Bedrock & PocketMine Server",
        lbl_ip: "Server IP:",
        lbl_port: "Port:",
        lbl_players: "Players Online:",
        btn_copy: "Copy Server IP",
        copied: "IP Copied to Clipboard!"
      },
      fa: {
        checking: "در حال بررسی سرور...",
        online: "سرور فعال است",
        offline: "سرور آفلاین است",
        subtitle: "سرور رسمی بدراک و پاکت‌ماین",
        lbl_ip: "آدرس سرور:",
        lbl_port: "پورت سرور:",
        lbl_players: "بازیکنان آنلاین:",
        btn_copy: "کپی آدرس سرور",
        copied: "آدرس سرور کپی شد!"
      }
    };

    let currentLang = localStorage.getItem('hivemc_lang') || 'en';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('hivemc_lang', lang);
      document.documentElement.dir = (lang === 'fa') ? 'rtl' : 'ltr';
      document.documentElement.lang = lang;

      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('btn-fa').classList.toggle('active', lang === 'fa');

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });
    }

    // دریافت داده‌های آنلاین سرور از API
    async function updateServerStatus() {
      try {
        const res = await fetch('/api/server-status');
        const data = await res.json();
        
        const dot = document.getElementById('server-dot');
        const statusText = document.getElementById('server-status-text');
        const playerCount = document.getElementById('player-count');

        if (data.online) {
          dot.className = "status-dot online";
          statusText.setAttribute('data-i18n', 'online');
          statusText.innerText = translations[currentLang].online;
          playerCount.innerText = `${data.currentPlayers} / ${data.maxPlayers}`;
        } else {
          dot.className = "status-dot offline";
          statusText.setAttribute('data-i18n', 'offline');
          statusText.innerText = translations[currentLang].offline;
          playerCount.innerText = "0 / 0";
        }
      } catch (err) {
        document.getElementById('server-dot').className = "status-dot offline";
        const statusText = document.getElementById('server-status-text');
        statusText.setAttribute('data-i18n', 'offline');
        statusText.innerText = translations[currentLang].offline;
      }
    }

    // کپی کردن آی‌پی با کلیک
    function copyServerAddress() {
      navigator.clipboard.writeText("sv2.tgmc.ir:27235");
      const btnText = document.getElementById('btn-copy-text');
      const originalText = translations[currentLang].btn_copy;
      btnText.innerText = translations[currentLang].copied;
      setTimeout(() => {
        btnText.innerText = originalText;
      }, 2500);
    }

    // مقداردهی اولیه
    setLanguage(currentLang);
    updateServerStatus();
    setInterval(updateServerStatus, 5000);
  </script>
</body>
</html>
