<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تست ویس‌چت ساده</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #1e1e2e; color: #fff; text-align: center; padding-top: 50px; }
        input, button { padding: 12px 20px; border-radius: 6px; border: none; font-size: 16px; margin: 5px; }
        button { background: #00b894; color: white; cursor: pointer; }
        #controls { display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>تست اتصال ویس‌چت</h2>
    
    <div id="login-box">
        <input type="text" id="username" placeholder="نام خود را وارد کنید">
        <button onclick="startVoice()">ورود به ویس</button>
    </div>
    
    <p id="status">متصل نشده‌اید.</p>

    <div id="controls">
        <button id="mute-btn" onclick="toggleMute()">بستن میکروفون (Mute)</button>
    </div>

    <!-- تگ صوتی برای پخش صدای بقیه کاربران -->
    <div id="audio-container"></div>

    <script>
        const socket = io();
        let myUsername = "";
        let localStream = null;
        let peers = {};
        let isMuted = false;

        async function startVoice() {
            myUsername = document.getElementById('username').value.trim();
            if (!myUsername) return alert("لطفاً نام خود را وارد کنید");

            document.getElementById('status').innerText = "در حال گرفتن دسترسی میکروفون...";

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('status').innerText = `متصل شدید به عنوان: ${myUsername}`;
                document.getElementById('controls').style.display = 'block';

                socket.emit('join', myUsername);
            } catch (err) {
                alert("خطا در دسترسی به میکروفون: " + err.message);
            }
        }

        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            const btn = document.getElementById('mute-btn');
            btn.style.background = isMuted ? "#d63031" : "#00b894";
            btn.innerText = isMuted ? "باز کردن میکروفون" : "بستن میکروفون (Mute)";
        }

        socket.on('user_joined', async ({ username, socketId }) => {
            console.log("User joined:", username);
            const pc = createPeerConnection(socketId);
            peers[socketId] = pc;
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socket.emit('signal', { targetSocketId: socketId, signalData: offer });
        });

        socket.on('signal', async ({ senderSocketId, signalData }) => {
            let pc = peers[senderSocketId];
            if (!pc) {
                pc = createPeerConnection(senderSocketId);
                peers[senderSocketId] = pc;
            }

            if (signalData.type === 'offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(signalData));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                socket.emit('signal', { targetSocketId: senderSocketId, signalData: answer });
            } else if (signalData.type === 'answer') {
                await pc.setRemoteDescription(new RTCSessionDescription(signalData));
            } else if (signalData.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(signalData));
            }
        });

        socket.on('user_left', (socketId) => {
            if (peers[socketId]) {
                peers[socketId].close();
                delete peers[socketId];
            }
        });

        function createPeerConnection(remoteSocketId) {
            const pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.ontrack = (event) => {
                console.log("Audio stream received from peer!");
                const audio = document.createElement('audio');
                audio.srcObject = event.streams[0];
                audio.autoplay = true;
                audio.controls = false; // می‌توانید برای تست true بگذارید تا پلیر صدا را ببیند
                document.getElementById('audio-container').appendChild(audio);
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('signal', { targetSocketId: remoteSocketId, signalData: event.candidate });
                }
            };

            return pc;
        }
    </script>
</body>
</html>
