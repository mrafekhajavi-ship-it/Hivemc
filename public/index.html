<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proximity Voice Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050505;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .bg-squares {
      position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    }
    .bg-squares span {
      position: absolute; bottom: -100px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      animation: floatUp 18s linear infinite;
    }
    .bg-squares span:nth-child(1) { left: 10%; width: 40px; height: 40px; animation-duration: 14s; }
    .bg-squares span:nth-child(2) { left: 25%; width: 70px; height: 70px; animation-duration: 20s; animation-delay: 2s; }
    .bg-squares span:nth-child(3) { left: 50%; width: 30px; height: 30px; animation-duration: 12s; animation-delay: 4s; }
    .bg-squares span:nth-child(4) { left: 75%; width: 85px; height: 85px; animation-duration: 22s; }
    .bg-squares span:nth-child(5) { left: 90%; width: 45px; height: 45px; animation-duration: 16s; animation-delay: 1s; }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-120vh) rotate(540deg); opacity: 0; }
    }
    .card {
      position: relative; z-index: 10;
      width: min(92%, 400px);
      height: 310px; /* ارتفاع کل کادر رو کمی بیشتر کردیم که جا بشه */
      padding: 25px 24px 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      background: rgba(15,15,15,0.9);
      backdrop-filter: blur(12px);
      text-align: center;
      box-shadow: 0 0 35px rgba(255,255,255,0.05);
    }
    .card > * {
      width: 100%;
    }
    .input-wrap {
      width: 80%; /* عرض کادر نام کاربری */
      margin: 0 auto 15px auto;
      padding: 1px; border-radius: 12px;
      background: #333; transition: 0.3s;
    }
    .input-wrap:focus-within {
      background: #fff;
      box-shadow: 0 0 16px rgba(255,255,255,0.4);
    }
    input {
      width: 100%; 
      height: 48px; /* ارتفاع دلخواه برای کادر (می‌تونی کم و زیادش کنی مثلاً 55px) */
      border: 0; outline: 0;
      border-radius: 11px; 
      padding: 0 15px; 
      background: #090909; color: #fff; text-align: center; font-size: 15px;
    }
    .rotating-border-btn {
      position: relative; overflow: hidden; width: 70%;
      margin: 20px auto 0 auto; 
      padding: 3px; border: 0; border-radius: 12px;
      background: transparent; cursor: pointer;
    }
    .rotating-border-btn::before {
      content: ""; position: absolute; inset: -150%; z-index: 1;
      background: conic-gradient(transparent 0deg, transparent 240deg, #38bdf8 300deg, transparent 360deg);
      animation: rotateBorder 2s linear infinite;
    }
    .rotating-border-btn span {
      position: relative; z-index: 2; display: block;
      border-radius: 10px; padding: 12px;
      background: #fff; color: #000; font-weight: 700;
    }
    @keyframes rotateBorder { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="bg-squares" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="card">
    <div>
      <h1 class="text-2xl font-bold text-white mb-1">Proximity Voice</h1>
      <p class="text-xs text-gray-400 mb-4">Talk directly to nearby players</p>
    </div>

    <div id="login-box">
      <div class="input-wrap">
        <input id="username" type="text" placeholder="Enter Minecraft Username" autocomplete="off" />
      </div>
      <button class="rotating-border-btn" onclick="connectVoice()">
        <span>Connect Voice</span>
      </button>
      <p id="err" class="text-red-400 text-xs mt-2 hidden"></p>
    </div>

    <div id="active-box" class="hidden p-4 rounded-xl bg-green-500/10 border border-green-500/30">
      <p class="text-green-400 font-semibold mb-1">● Voice Connected</p>
      <p id="pos-info" class="text-xs text-gray-400">Waiting for coordinates...</p>
    </div>
  </div>

<!-- دکمه میکروفون (Mute/Unmute Mic) -->
<button id="mic-btn" class="control-btn">
  <i class="fa-solid fa-microphone" id="mic-icon"></i>
</button>

<!-- دکمه هدفون (Deafen/Undeafen Sound) -->
<button id="deafen-btn" class="control-btn">
  <i class="fa-solid fa-headphones" id="deafen-icon"></i>
</button>

  
  <script>
    const socket = io();
    let localStream;

    async function connectVoice() {
      const name = document.getElementById('username').value.trim();
      const err = document.getElementById('err');
      if (!name) {
        err.textContent = "Please enter your username";
        err.classList.remove('hidden');
        return;
      }
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        socket.emit('register', { name });
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('active-box').classList.remove('hidden');
      } catch (e) {
        err.textContent = "Microphone access denied or unavailable";
        err.classList.remove('hidden');
      }
    }

    socket.on('positions', (players) => {
      document.getElementById('pos-info').textContent = "Tracking " + Object.keys(players).length + " player(s)";
    });
  </script>
</body>
</html>
